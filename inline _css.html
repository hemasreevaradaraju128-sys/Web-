<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INLINE CSS</title>
</head>
<body>
    <h1 style="color: blueviolet; text-align: center;">my website</h1>

<!-- the style is applied directly to this paragraph -->
<p style="color: blueviolet;font-size:30px">this is an example of inline css</p>

<!-- Another element with its own style -->

<button style="color: blueviolet; background-color: black;">click me</button>

</body>
</html>
