<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css borders</title>
<style>

p{ color: cadetblue;
}

h1{ color: blue;
    text-align: center; 
   background-color: aqua;}

.box1{ border: 3px dashed blueviolet;
        border-radius: 16px;}


.box2{ border: 3px dotted rgb(169, 42, 122);
        border-radius: 16px;}


.box3{ border: 3px double rgb(33, 119, 129);
        border-radius: 16px;}


.box4{ border: 3px solid rgb(68, 12, 172);
        border-radius: 16px;}




</style>


</head>
<body>

    <h1>css borders</h1>

<p>this paragraph has a solid border.</p>

<p class="box1">this is a dashed border</p>

<p class="box2">this is a dotted border</p>

<p class="box3">this is a double border</p>

<p class="box4">this is a rounded border</p>


</body>
</html>
